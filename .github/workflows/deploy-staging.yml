name: deploy-staging

# Enable automatic push deploy after staging secrets/vars are configured:
# set repository variable ENABLE_STAGING_DEPLOY=true
on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_STAGING_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish API
        working-directory: backend
        run: |
          dotnet publish src/AiBrandStudio.Api/AiBrandStudio.Api.csproj -c Release -o "${{ runner.temp }}/api-publish"

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy API to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_API_APP_NAME }}
          package: ${{ runner.temp }}/api-publish

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build web
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          npm ci
          npm run build
          # Standalone package for App Service (no Oryx rebuild)
          cp -r public .next/standalone/ 2>/dev/null || true
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/

      - name: Deploy web to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEB_APP_NAME }}
          package: frontend/.next/standalone

      - name: Staging smoke
        env:
          BASE: ${{ secrets.STAGING_API_URL }}
        run: |
          chmod +x scripts/smoke.sh
          ./scripts/smoke.sh
