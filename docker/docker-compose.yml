services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_Password123"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sql,1433;Database=AiBrandStudio;User Id=sa;Password=Your_strong_Password123;TrustServerCertificate=True;"
      ConnectionStrings__Redis: redis:6379
      Jwt__Issuer: AiBrandStudio
      Jwt__Audience: AiBrandStudio
      Jwt__Key: DOCKER_DEV_CHANGE_ME_TO_A_LONG_RANDOM_SECRET_KEY
      Storage__LocalPath: /app/storage
      AI__DefaultTextProvider: Mock
      AI__DefaultImageProvider: Mock
      Cors__Origins: http://localhost:3000
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "5080:8080"
    volumes:
      - apistorage:/app/storage
    depends_on:
      - sql
      - redis

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5080
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  sqldata:
  apistorage:
