apiVersion: apps/v1
kind: Deployment
metadata:
  name: aibrand-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aibrand-api
  template:
    metadata:
      labels:
        app: aibrand-api
    spec:
      containers:
        - name: api
          image: aibrandstudio/api:latest
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: http://+:8080
---
apiVersion: v1
kind: Service
metadata:
  name: aibrand-api
spec:
  selector:
    app: aibrand-api
  ports:
    - port: 80
      targetPort: 8080
